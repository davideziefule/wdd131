<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rate a product, share your experience, and submit a product review.">
    <meta name="author" content="David Eziefule">
    <title>Product Review | David Eziefule</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <div class="header-content">
            <h1>Product Review</h1>
            <p>Your feedback helps others make better decisions.</p>
        </div>
    </header>

    <main>
        <form method="get" action="review.html">

            <p class="required-note">
                <span class="required-mark">*</span> Required field
            </p>

            <fieldset class="form-section">
                <legend>Product Information</legend>

                <div class="form-group">
                    <label for="product">
                        Product Name <span class="required-mark">*</span>
                    </label>

                    <select id="product" name="product" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="installDate">
                        Date of Installation <span class="required-mark">*</span>
                    </label>

                    <input type="date" id="installDate" name="installDate" required>
                </div>
            </fieldset>

            <fieldset class="form-section">
                <legend>
                    Overall Rating <span class="required-mark">*</span>
                </legend>

                <p class="field-description">Select your overall rating for this product.</p>

                <div class="rating-options">

                    <label class="rating-option" for="rating1">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <span class="stars">★</span>
                        <span class="rating-number">1</span>
                    </label>

                    <label class="rating-option" for="rating2">
                        <input type="radio" id="rating2" name="rating" value="2" required>
                        <span class="stars">★★</span>
                        <span class="rating-number">2</span>
                    </label>

                    <label class="rating-option" for="rating3">
                        <input type="radio" id="rating3" name="rating" value="3" required>
                        <span class="stars">★★★</span>
                        <span class="rating-number">3</span>
                    </label>

                    <label class="rating-option" for="rating4">
                        <input type="radio" id="rating4" name="rating" value="4" required>
                        <span class="stars">★★★★</span>
                        <span class="rating-number">4</span>
                    </label>

                    <label class="rating-option" for="rating5">
                        <input type="radio" id="rating5" name="rating" value="5" required>
                        <span class="stars">★★★★★</span>
                        <span class="rating-number">5</span>
                    </label>

                </div>
            </fieldset>

            <fieldset class="form-section">
                <legend>Useful Features</legend>

                <p class="field-description">
                    Which features did you find useful? Select all that apply.
                </p>

                <div class="feature-options">

                    <label class="checkbox-option" for="durability">
                        <input type="checkbox" id="durability" name="features" value="Durability">
                        <span>Durability</span>
                    </label>

                    <label class="checkbox-option" for="ease">
                        <input type="checkbox" id="ease" name="features" value="Ease of Use">
                        <span>Ease of Use</span>
                    </label>

                    <label class="checkbox-option" for="performance">
                        <input type="checkbox" id="performance" name="features" value="Performance">
                        <span>Performance</span>
                    </label>

                    <label class="checkbox-option" for="design">
                        <input type="checkbox" id="design" name="features" value="Design">
                        <span>Design</span>
                    </label>

                </div>
            </fieldset>

            <fieldset class="form-section">
                <legend>Your Review</legend>

                <div class="form-group">
                    <label for="review">
                        Written Review <span class="optional">(Optional)</span>
                    </label>

                    <textarea id="review" name="review" rows="5"
                        placeholder="Share your thoughts about this product..."></textarea>
                </div>

                <div class="form-group">
                    <label for="userName">
                        Your Name <span class="optional">(Optional)</span>
                    </label>

                    <input type="text" id="userName" name="userName" autocomplete="name">
                </div>
            </fieldset>

            <input type="hidden" id="submissionId" name="submissionId">

            <input type="submit" value="Submit Review" class="submit-button">

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> David Eziefule Dev</p>
    </footer>

</body>

</html>
