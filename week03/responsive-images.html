<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Images</title>
    <meta name="description" content="Responsive Images">
    <meta name="author" content="David C. Eziefule">
    <meta name="keywords" content="HTML, CSS, JavaScript, Responsive Images">
    <link rel="stylesheet" href="styles/responsive-images.css">
</head>
<body>
    <header>
        <h1>Responsive Images</h1>
    </header>
    <main>
        <div class="hero">
            <picture>
                <source media="(min-width: 1000px)" srcset="images/hero-large.webp">
                <source media="(min-width: 500px)" srcset="images/hero-medium.webp">
                <img src="images/hero-small.webp" alt="Aba Nigeria Temple" width="500px" height="250px">
            </picture>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Responsive Images Example</p>
    </footer>
</body>
</html>
